<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nachricht gesendet — Female Signature</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#F4F1EB;color:#1C1C1C;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.wrap{max-width:520px}
.check{width:64px;height:64px;margin:0 auto 24px;border:2px solid #5C1F2B;border-radius:50%;display:flex;align-items:center;justify-content:center}
.check svg{width:28px;height:28px;stroke:#5C1F2B;fill:none;stroke-width:2.5}
h1{font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-.01em}
h1 span{font-family:'Playfair Display',serif;font-style:italic;color:#5C1F2B;font-weight:400}
p{font-size:15px;color:#7A7A7A;line-height:1.7;margin-bottom:28px}
a{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:#fff;background:#1C1C1C;padding:14px 32px;transition:all .3s}
a:hover{background:#5C1F2B}
</style>
</head>
<body>
<div class="wrap">
<div class="check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1>Vielen <span>Dank.</span></h1>
<p>Ihre Nachricht ist angekommen. Wir melden uns innerhalb von 24 Stunden bei Ihnen.</p>
<a href="/">Zurück zur Startseite</a>
</div>
</body>
</html>
